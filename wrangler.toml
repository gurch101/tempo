name = "tempo-preview"
main = "src/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/admin", "/admin/*", "/", "/p/*"]

[[d1_databases]]
binding = "DB"
database_name = "tempo-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_ID"
migrations_dir = "migrations"

[observability]
enabled = true

[env.production]
name = "tempo"
workers_dev = false

[[env.production.routes]]
  pattern = "tempo.121gw.dev"
  custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "tempo-production"
database_id = "479dfcb4-df1b-4cdb-ab9c-228d3f4dfeac"
migrations_dir = "migrations"

[env.production.observability]
enabled = true
